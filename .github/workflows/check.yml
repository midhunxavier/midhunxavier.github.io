name: Check site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with GitHub Pages dependencies
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Check internal links and assets
        run: bundle exec ruby scripts/check_links.rb
