    <pattern id="cells" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="25" height="25" rx="3" fill="#f3e4d4"/>
    </pattern>
    <g id="matrix">
      <rect width="180" height="150" fill="url(#cells)"/>
      <g fill="#dfb39c">
        <rect x="2" y="32" width="25" height="25" rx="3"/>
        <rect x="32" y="2" width="25" height="25" rx="3"/>
        <rect x="32" y="92" width="25" height="25" rx="3"/>
        <rect x="62" y="62" width="25" height="25" rx="3"/>
        <rect x="92" y="122" width="25" height="25" rx="3"/>
        <rect x="122" y="32" width="25" height="25" rx="3"/>
        <rect x="152" y="92" width="25" height="25" rx="3"/>
      </g>
      <g fill="#eacbb5">
        <rect x="2" y="122" width="25" height="25" rx="3"/>
        <rect x="62" y="2" width="25" height="25" rx="3"/>
        <rect x="92" y="62" width="25" height="25" rx="3"/>
        <rect x="122" y="122" width="25" height="25" rx="3"/>
        <rect x="152" y="2" width="25" height="25" rx="3"/>
      </g>
