  <rect width="1000" height="380" fill="#e9b39b"/>
  <rect width="1000" height="380" fill="url(#paper)"/>
  <path d="M0 294H1000M500 0V380" fill="none" stroke="#99573f" stroke-opacity=".23"/>
  <g fill="#fff7ec" stroke="#ba7a60">
    <rect x="176" y="64" width="265" height="230" rx="15"/>
    <rect x="559" y="64" width="265" height="230" rx="15"/>
  </g>
  <use href="#matrix" x="219" y="101"/>
  <use href="#matrix" x="602" y="101"/>
  <g fill="#b85539">
    <rect x="664" y="163" width="25" height="25" rx="3"/>
    <rect x="694" y="163" width="25" height="25" rx="3"/>
    <rect x="694" y="193" width="25" height="25" rx="3"/>
  </g>
  <g fill="none" stroke="#7f3f2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M466 180H534M523 170L534 180L523 190"/>
    <path d="M651 152h15m-15 0v15m79-15h-15m15 0v15m0 62h-15m15 0v-15m-79 15h15m-15 0v-15" stroke-dasharray="2 3"/>
