<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title">
  <title id="title">A targeted edit to a weight matrix</title>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
