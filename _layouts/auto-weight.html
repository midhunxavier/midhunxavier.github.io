<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}{% unless page.auto_weight_home %} · AutoWeight{% endunless %}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="AutoWeight">
  <meta property="og:type" content="{% if page.auto_weight_home %}website{% else %}article{% endif %}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.excerpt | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/auto-weight-cover.svg' | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/auto-weight-mark.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/auto-weight.css' | relative_url }}">
  <script src="{{ '/assets/js/auto-weight.js' | relative_url }}" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="{{ '/auto-weight/' | relative_url }}" aria-label="AutoWeight home">
        <img src="{{ '/images/auto-weight-mark.svg' | relative_url }}" width="30" height="30" alt="">
        <strong>AutoWeight</strong>
      </a>
      <nav class="product-nav" aria-label="AutoWeight">
        <a href="{{ '/auto-weight/#how-it-works' | relative_url }}">Workflow</a>
        <a href="{{ '/blog/auto-weight/checkpoint-repair-and-weight-space-experiments/' | relative_url }}">Blog</a>
        <a class="package-link" href="{{ '/auto-weight/#connect' | relative_url }}">Connect CLI <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="content" tabindex="-1">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <a href="#top">Back to top ↑</a>
      <button type="button" class="theme-toggle" aria-pressed="false" hidden>Dark mode</button>
    </div>
  </footer>
</body>
</html>
